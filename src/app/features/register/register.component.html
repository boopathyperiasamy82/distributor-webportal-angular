<div class="register-wrapper">
  <div class="register-card">
    <div class="register-header">
      <img src="assets/images/bsr-logo.png" alt="BSR Logo" class="logo" onerror="this.src='https://via.placeholder.com/150x50?text=BSR+Solutions'" />
      <h2>Create an Account</h2>
      <p>Distributor Web Portal</p>
    </div>
    
    <form [formGroup]="registerForm" (ngSubmit)="onSubmit()">
      <div class="form-group">
        <label>Full Name</label>
        <input type="text" formControlName="name" placeholder="Enter your full name" />
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Distributor Code</label>
          <input type="text" formControlName="distrCode" placeholder="E.g., D001" />
        </div>
        <div class="form-group">
          <label>Username</label>
          <input type="text" formControlName="username" placeholder="Choose username" />
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Email Address</label>
          <input type="email" formControlName="email" placeholder="name@company.com" />
        </div>
        <div class="form-group">
          <label>Phone Number</label>
          <input type="text" formControlName="phone" placeholder="10-digit number" />
        </div>
      </div>
      
      <div class="form-row">
        <div class="form-group">
          <label>Password</label>
          <input type="password" formControlName="password" placeholder="Min 6 chars" />
        </div>
        <div class="form-group">
          <label>Confirm Password</label>
          <input type="password" formControlName="confirmPassword" placeholder="Confirm password" />
          @if (registerForm.hasError('mismatch') && registerForm.get('confirmPassword')?.touched) {
            <small class="error-text">Passwords do not match</small>
          }
        </div>
      </div>
      
      <button type="submit" class="btn-register" [disabled]="registerForm.invalid || loading">
        {{ loading ? 'Creating Account...' : 'Register' }}
      </button>
    </form>
    
    <div class="register-footer">
      <p>Already have an account? <a routerLink="/login">Log in here</a></p>
    </div>
  </div>
</div>
